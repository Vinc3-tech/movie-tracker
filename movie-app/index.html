<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Tracker</title>

    <link rel="stylesheet" href="src/styles/main.css">
    <link rel="stylesheet" href="src/styles/colors.css">
    <link rel="stylesheet" href="src/styles/font.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
  </head>
  <body>
    
    <nav id="navbar">
      <div class="intro">
        <h2 id="welcome" class="manrope-400">Welcome Vincenzo</h2>
        <h1 id="t-dashboard" class="bebas-neue-regular">Your Dashboard</h1>
      </div>
      <div class="cont-search-icon">
        <form class="search-bar manrope-400">
          <label for="input-field" id="search-label">Search film, series...</label>
          <input type="text" name="search" id="input-field">
        </form>
        <img src="src/icons/search.png" alt="search-icon" class="search-icon">
      </div>
    </nav>

    <section id="discoverSection">
      <h2 id="t-discover" class="manrope-500">Discover new films</h2>
      <div class="container-films">
        <!--film generati all'apertura-->
      </div>
    </section>

    <div id="movie"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script type="module" src="src/main.js"></script>
    <script type="module" src="src/API/api.js"></script>
    <script type="module" src="src/components/card.js"></script>

  </body>
</html>
