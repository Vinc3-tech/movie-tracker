<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Movie Tracker</title>

    <link rel="stylesheet" href="src/styles/main.css">
    <link rel="stylesheet" href="src/styles/colors.css">
    <link rel="stylesheet" href="src/styles/font.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@200..800&display=swap" rel="stylesheet">
  </head>
  <body>
    
    <nav id="navbar">
      <div class="intro">
        <h2 id="welcome" class="manrope-400">Welcome Vincenzo</h2>
        <h1 id="t-dashboard" class="bebas-neue-regular">Your Dashboard</h1>
      </div>
      <div class="cont-search">
        <form class="form-search-bar glass-box manrope-400">
          <label for="input-field" id="search-label">Search film, series...</label>
          <input type="text" name="search" id="input-field">
        </form>
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="search-icon">
          <g id="SVGRepo_bgCarrier" stroke-width="0"></g><g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M19.9604 11.4802C19.9604 13.8094 19.0227 15.9176 17.5019 17.4512C16.9332 18.0247 16.2834 18.5173 15.5716 18.9102C14.3594 19.5793 12.9658 19.9604 11.4802 19.9604C6.79672 19.9604 3 16.1637 3 11.4802C3 6.79672 6.79672 3 11.4802 3C16.1637 3 19.9604 6.79672 19.9604 11.4802Z" stroke-width="2.5"></path> <path d="M18.1553 18.1553L21.8871 21.8871" stroke-width="2.5" stroke-linecap="round"></path> </g>
        </svg>
      </div>
    </nav>

    <section id="discoverSection">
      <h2 id="t-discover" class="manrope-500">Discover new films</h2>
      <div class="cont-arrow-left glass-box">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" id="svg-arrow-left">
          <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M4 12H20M20 12L14 6M20 12L14 18" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path> </g>
        </svg>
      </div>
      <div class="container-films">
        <!--film generati all'apertura-->
      </div>
      <div class="cont-arrow-right glass-box">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" id="svg-arrow-right">
          <g id="SVGRepo_tracerCarrier" stroke-linecap="round" stroke-linejoin="round"></g><g id="SVGRepo_iconCarrier"> <path d="M4 12H20M20 12L14 6M20 12L14 18" stroke="var(--accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"></path> </g>
        </svg>
      </div>
    </section>

    <div id="movie"></div>

    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/gsap.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.13.0/dist/ScrollTrigger.min.js"></script>
    <script type="module" src="src/components/main.js"></script>
    <script type="module" src="src/API/api.js"></script>
    <script type="module" src="src/components/card.js"></script>
    <script type="module" src="src/components/animation.js"></script>

  </body>
</html>
